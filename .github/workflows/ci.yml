name: UserService CI

on:
  push:
    branches:
      - develop
      - main
      - "feature/**"

  pull_request:
    branches:
      - develop
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore UserService.sln

      - name: Build solution
        run: dotnet build UserService.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test UserService.sln --configuration Release --no-build